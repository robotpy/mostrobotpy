classes:
  wpi::math::ExponentialProfile:
    doc_code_blocks:
    - |
      from wpimath import ExponentialProfile

      # Example constraints: 12 V maximum input, kV = 2.0 V/(m/s),
      # and kA = 0.5 V/(m/s²). Use your mechanism's characterized values.
      constraints = ExponentialProfile.Constraints.from_characteristics(12.0, 2.0, 0.5)
      previous_profiled_reference = ExponentialProfile.State(0.0, 0.0)
      profile = ExponentialProfile(constraints)
    - |
      # The goal can change on each update; position is in meters.
      unprofiled_reference = ExponentialProfile.State(5.0, 0.0)
      time_since_previous_update = 0.02  # seconds
      previous_profiled_reference = profile.calculate(
          time_since_previous_update, previous_profiled_reference, unprofiled_reference
      )
    force_type_casters:
    - wpi::units::meters_per_second_t
    template_params:
    - Distance
    - Input
    methods:
      ExponentialProfile:
      Calculate:
      CalculateInflectionPoint:
        overloads:
          const State&, const State& [const]:
      TimeLeftUntil:
      CalculateProfileTiming:
        overloads:
          const State&, const State& [const]:
  wpi::math::ExponentialProfile::Constraints:
    attributes:
      maxInput:
      A:
      B:
    methods:
      Constraints:
        overloads:
          Input_t, A_t, B_t:
            ignore: true
          Input_t, kV_t, kA_t:
            ignore: true
      MaxVelocity:
    inline_code: |
      .def_static("from_state_space", [](Input_t maxInput, A_t a, B_t b) {
          return typename wpi::math::ExponentialProfile<Distance, Input>::Constraints(maxInput, a, b);
        }, py::arg("max_input"), py::arg("a"), py::arg("b"))
      .def_static("from_characteristics", [](Input_t maxInput, kV_t kv, kA_t ka) {
          return typename wpi::math::ExponentialProfile<Distance, Input>::Constraints(maxInput, kv, ka);
        }, py::arg("max_input"), py::arg("k_v"), py::arg("k_a"))

  wpi::math::ExponentialProfile::State:
    force_no_default_constructor: true
    attributes:
      position:
      velocity:
    methods:
      operator==:
    inline_code: |
      .def(py::init<Distance_t, Velocity_t>())
  wpi::math::ExponentialProfile::ProfileTiming:
    attributes:
      inflectionTime:
      totalTime:
    methods:
      IsFinished:

templates:
  ExponentialProfile:
    qualname: wpi::math::ExponentialProfile
    params:
    - wpi::units::meter
    - wpi::units::volt
