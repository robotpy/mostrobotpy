defaults:
  subpackage: _schema

functions:
  PackSchema:
    no_release_gil: true
  UnpackSchema:
    no_release_gil: true

classes:
  wpy::structs::SchemaDescriptor:
    methods:
      IsValid:
        no_release_gil: true
      GetSize:
        no_release_gil: true
  wpy::structs::SchemaDatabase:
    methods:
      SchemaDatabase:
      Add:
        no_release_gil: true
      AddAll:
        no_release_gil: true

inline_code: |
  cls_SchemaDescriptor
    .def_property_readonly("is_valid", &wpy::structs::SchemaDescriptor::IsValid)
    .def_property_readonly("size", &wpy::structs::SchemaDescriptor::GetSize);
