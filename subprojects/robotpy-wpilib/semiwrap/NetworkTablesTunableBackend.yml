extra_includes:
- wpi/tunables/ComplexTunable.hpp

classes:
  wpi::backend::NetworkTablesTunableBackend:
    typealias:
    - wpi::tunables::TunableBackend::PublishedTunable
    methods:
      NetworkTablesTunableBackend:
      Publish:
        ignore_py: true
        virtual_xform: |
          [&](py::function fn) {
            py::object pyConfig = py::none();
            if (config) {
              pyConfig = py::cast(*config, py::return_value_policy::copy);
              if (config->parent) {
                py::detail::keep_alive_impl(
                    pyConfig,
                    py::cast(config->parent,
                             py::return_value_policy::reference));
              }
            }
            return fn(path, uid,
                      py::cast(&tunable, py::return_value_policy::reference),
                      pyConfig, type)
                .cast<bool>();
          }
      MarkDirty:
      Remove:
      RemovePrefix:
      UnregisterTunable:
      Update:
      Retire:
